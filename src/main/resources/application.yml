spring:
  datasource:
    url: jdbc:postgresql://${DATABASE_URL:localhost}:${DATABASE_PORT:5433}/onlineorder
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver
  jackson:
    default-property-inclusion: non_null
    property-naming-strategy: SNAKE_CASE
  sql:
    init:
      mode: ${INIT_DB:always}
      schema-locations: "classpath:database-init.sql"
  cache:
    type: caffeine
    cache-names: cart,restaurants
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=60s


logging:
  level:
    org.apache.coyote.http11.Http11InputBuffer: INFO
    org.springframework.jdbc.datasource.init: INFO
    org.springframework.jdbc.core: INFO
